<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background linen gradient -->
    <linearGradient id="linenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>

    <!-- Deep Palm Green Header -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142C20"/>
      <stop offset="50%" stop-color="#1B3B2B"/>
      <stop offset="100%" stop-color="#142C20"/>
    </linearGradient>

    <filter id="labelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#1B3B2B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Label Container with Rounded Organic Corners -->
  <rect x="40" y="40" width="1520" height="920" rx="32" fill="url(#linenGrad)" stroke="#E8DFD1" stroke-width="4" filter="url(#labelShadow)"/>
  <rect x="56" y="56" width="1488" height="888" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="16 8"/>

  <!-- Top Banner Section -->
  <path d="M 56 56 H 1544 V 230 H 56 Z" fill="url(#headerGrad)"/>
  
  <!-- Banner Gold Border -->
  <line x1="56" y1="230" x2="1544" y2="230" stroke="#C5A059" stroke-width="3"/>

  <!-- Emblem Icon in Header -->
  <g transform="translate(100, 95) scale(3.5)">
    <circle cx="12" cy="12" r="14" fill="#244B38" stroke="#C5A059" stroke-width="1"/>
    <path d="M12 2C12 2 14 6 14 9C14 10.5 13 12 12 12C11 12 10 10.5 10 9C10 6 12 2 12 2Z" fill="#C5A059"/>
    <path d="M12 22C12 22 10 18 10 15C10 13.5 11 12 12 12C13 12 14 13.5 14 15C14 18 12 22 12 22Z" fill="#C5A059"/>
    <path d="M2 12C2 12 6 10 9 10C10.5 10 12 11 12 12C12 13 10.5 14 9 14C6 14 2 12 2 12Z" fill="#C5A059"/>
    <path d="M22 12C22 12 18 14 15 14C13.5 14 12 13 12 12C12 11 13.5 10 15 10C18 10 22 12 22 12Z" fill="#C5A059"/>
    <circle cx="12" cy="12" r="2.5" fill="#FAF7F2"/>
  </g>

  <!-- Brand Typography in Header -->
  <text x="230" y="125" fill="#FAF7F2" font-family="'Tajawal', 'Arial', sans-serif" font-size="52" font-weight="800">
    مزرعة النوار
  </text>
  <text x="235" y="165" fill="#C5A059" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="24" font-weight="700" letter-spacing="4">
    THE BLOSSOM'S FARM • AL-AMMARIYAH
  </text>

  <!-- Tagline Right -->
  <text x="1490" y="125" text-anchor="end" fill="#E8DFD1" font-family="'Tajawal', 'Arial', sans-serif" font-size="28" font-weight="600">
    محاصيل طماطم عضوية نادرة وفاخرة
  </text>
  <text x="1490" y="165" text-anchor="end" fill="#C85A32" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="20" font-weight="700" letter-spacing="2">
    RARE ORGANIC HEIRLOOM HARVEST
  </text>

  <!-- Main Body Left: Harvest & Variety Information Grid -->
  <g transform="translate(100, 290)">
    <!-- Variety Title Box -->
    <rect x="0" y="0" width="880" height="150" rx="16" fill="#FFFFFF" stroke="#E8DFD1" stroke-width="2"/>
    <text x="35" y="55" fill="#7A8A7E" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="2">
      PREMIUM HEIRLOOM SELECTION • الصنف المميز
    </text>
    <text x="35" y="105" fill="#1B3B2B" font-family="'Tajawal', 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900">
      طماطم لؤلؤة القرمز الإرثية • Crimson Pearl Heirloom
    </text>
    <rect x="700" y="40" width="145" height="40" rx="20" fill="#1B3B2B"/>
    <text x="772" y="66" text-anchor="middle" fill="#FAF7F2" font-family="'Tajawal', sans-serif" font-size="18" font-weight="700">
      Brix: 9.2°
    </text>

    <!-- Details Specs Grid -->
    <g transform="translate(0, 180)">
      <!-- Box 1: Origin -->
      <rect x="0" y="0" width="425" height="110" rx="14" fill="#FFFFFF" stroke="#E8DFD1" stroke-width="1.5"/>
      <text x="25" y="40" fill="#7A8A7E" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
        ORIGIN / المنشأ
      </text>
      <text x="25" y="80" fill="#1B3B2B" font-family="'Tajawal', sans-serif" font-size="22" font-weight="800">
        واحة العمارية، الرياض، المملكة
      </text>

      <!-- Box 2: Harvest Date -->
      <rect x="455" y="0" width="425" height="110" rx="14" fill="#FFFFFF" stroke="#E8DFD1" stroke-width="1.5"/>
      <text x="480" y="40" fill="#7A8A7E" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
        HARVEST / تاريخ القطاف
      </text>
      <text x="480" y="80" fill="#1B3B2B" font-family="'Tajawal', sans-serif" font-size="22" font-weight="800">
        قطاف طازج يومي • Fresh Daily
      </text>
    </g>

    <!-- Details Specs Grid Row 2 -->
    <g transform="translate(0, 315)">
      <!-- Box 3: Storage Tips -->
      <rect x="0" y="0" width="880" height="135" rx="14" fill="#FBF7F0" stroke="#C5A059" stroke-width="1.5"/>
      <text x="30" y="40" fill="#C85A32" font-family="'Tajawal', sans-serif" font-size="18" font-weight="800">
        إرشادات الحفظ المثالي • OPTIMAL STORAGE ADVICE:
      </text>
      <text x="30" y="75" fill="#2D3B31" font-family="'Tajawal', sans-serif" font-size="17" font-weight="600">
        تحفظ في درجة حرارة الغرفة (١٨-٢٢°م) في مكان جيد التهوية وبعيداً عن أشعة الشمس المباشرة. تجنب التبريد بالثلاجة للحفاظ على تركيز السكريات والزيوت العطرية.
      </text>
      <text x="30" y="105" fill="#5C6E61" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500">
        Store at room temperature (18-22°C) stem-down. Do not refrigerate to preserve complex sugars and natural bouquet.
      </text>
    </g>

    <!-- Certification Badges Row -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="270" height="42" rx="21" fill="#1B3B2B"/>
      <text x="135" y="27" text-anchor="middle" fill="#FAF7F2" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700">
        🌱 عضوي معتمد ١٠٠٪
      </text>

      <rect x="290" y="0" width="270" height="42" rx="21" fill="#C85A32"/>
      <text x="425" y="27" text-anchor="middle" fill="#FAF7F2" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700">
        ☀️ بدون مبيدات كيميائية
      </text>

      <rect x="580" y="0" width="300" height="42" rx="21" fill="#2D3B31"/>
      <text x="730" y="27" text-anchor="middle" fill="#C5A059" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700">
        💧 ري من مياه جوفية عذبة
      </text>
    </g>
  </g>

  <!-- Right Side Plinth: Large QR Code with Scan Instructions -->
  <g transform="translate(1040, 270)">
    <!-- QR Card Container -->
    <rect x="0" y="0" width="460" height="600" rx="24" fill="#FFFFFF" stroke="#E8DFD1" stroke-width="2"/>
    <rect x="12" y="12" width="436" height="576" rx="18" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="10 5"/>

    <!-- QR Badge Header -->
    <rect x="50" y="30" width="360" height="44" rx="22" fill="#1B3B2B"/>
    <text x="230" y="58" text-anchor="middle" fill="#FAF7F2" font-family="'Tajawal', sans-serif" font-size="17" font-weight="800">
      امسح لزيارة المزرعة • SCAN TO EXPLORE
    </text>

    <!-- Center Scaled QR Code -->
    <g transform="translate(65, 95) scale(11.38)">
      <path fill="#FFFFFF" d="M0 0h29v29H0z"/>
      <path stroke="#1B3B2B" d="M0 0.5h7m1 0h2m1 0h1m5 0h2m1 0h1m1 0h7M0 1.5h1m5 0h1m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1m2 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h1m1 0h1m8 0h2m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m2 0h2m2 0h1m1 0h3m1 0h1m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m2 0h1m3 0h4m2 0h2m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h1m2 0h4m1 0h1m1 0h1m3 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m1 0h2m2 0h1m1 0h1m3 0h1M2 8.5h3m1 0h1m1 0h2m1 0h3m4 0h2m1 0h3m2 0h3M0 9.5h1m2 0h2m3 0h3m2 0h4m4 0h6m1 0h1M0 10.5h2m2 0h1m1 0h1m2 0h3m1 0h2m2 0h2m1 0h3m2 0h2M0 11.5h3m1 0h2m1 0h1m4 0h2m1 0h2m4 0h2m1 0h2m1 0h1M1 12.5h2m1 0h1m1 0h3m1 0h1m2 0h2m1 0h2m3 0h1m1 0h1m2 0h3M0 13.5h2m1 0h1m1 0h1m1 0h1m4 0h1m1 0h9m1 0h2m1 0h2M1 14.5h1m1 0h1m1 0h3m3 0h6m1 0h1m3 0h2M0 15.5h2m3 0h1m2 0h2m1 0h2m1 0h2m1 0h1m1 0h1m4 0h2m2 0h1M0 16.5h3m1 0h1m1 0h2m4 0h2m1 0h1m1 0h2m2 0h1m1 0h1m1 0h3M0 17.5h1m6 0h4m5 0h13M0 18.5h1m5 0h1m3 0h2m1 0h2m2 0h2m1 0h1m1 0h4M0 19.5h1m2 0h1m1 0h1m1 0h1m1 0h2m2 0h1m5 0h1m2 0h1m1 0h2m1 0h2M0 20.5h1m1 0h5m1 0h1m1 0h2m4 0h3m1 0h5m1 0h1M8 21.5h1m1 0h2m1 0h2m5 0h1m3 0h2m2 0h1M0 22.5h7m2 0h3m1 0h1m1 0h1m1 0h4m1 0h1m1 0h1M0 23.5h1m5 0h1m2 0h1m1 0h2m1 0h2m1 0h1m1 0h2m3 0h2m2 0h1M0 24.5h1m1 0h3m1 0h1m1 0h1m1 0h1m4 0h3m2 0h8M0 25.5h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m1 0h1M0 26.5h1m1 0h3m1 0h1m1 0h3m2 0h1m4 0h7m1 0h2M0 27.5h1m5 0h1m3 0h1m1 0h1m1 0h7m1 0h1m1 0h2m1 0h1M0 28.5h7m3 0h2m5 0h1m1 0h1m1 0h2m1 0h1m1 0h1"/>
    </g>

    <!-- Center Botanical Shield on QR -->
    <circle cx="230" cy="260" r="38" fill="#FAF7F2" stroke="#C5A059" stroke-width="2.5"/>
    <circle cx="230" cy="260" r="32" fill="#1B3B2B"/>
    <g transform="translate(220, 250) scale(0.85)">
      <path d="M12 2C12 2 14 6 14 9C14 10.5 13 12 12 12C11 12 10 10.5 10 9C10 6 12 2 12 2Z" fill="#C5A059"/>
      <path d="M12 22C12 22 10 18 10 15C10 13.5 11 12 12 12C13 12 14 13.5 14 15C14 18 12 22 12 22Z" fill="#C5A059"/>
      <path d="M2 12C2 12 6 10 9 10C10.5 10 12 11 12 12C12 13 10.5 14 9 14C6 14 2 12 2 12Z" fill="#C5A059"/>
      <path d="M22 12C22 12 18 14 15 14C13.5 14 12 13 12 12C12 11 13.5 10 15 10C18 10 22 12 22 12Z" fill="#C5A059"/>
      <circle cx="12" cy="12" r="2.5" fill="#FAF7F2"/>
    </g>

    <!-- Scan Instructions Bottom -->
    <text x="230" y="475" text-anchor="middle" fill="#1B3B2B" font-family="'Tajawal', sans-serif" font-size="20" font-weight="800">
      استكشف قصة المحصول ووصفات الطهاة
    </text>
    <text x="230" y="505" text-anchor="middle" fill="#7A8A7E" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">
      Scan for Chef Recipes &amp; Farm Stories
    </text>
    <text x="230" y="545" text-anchor="middle" fill="#C85A32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
      theblossomsfarm.sa
    </text>
  </g>
</svg>
