<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Luxury Deep Forest Green Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1B3B2B" stroke="#C5A059" stroke-width="2.5" />

  <!-- Inner Subtle Gold Accent Ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#D8B878" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="3 2" />

  <!-- Botanical Sprout & Blossom Emblem -->
  <g transform="translate(32, 34)">
    <!-- Central Rising Shoot / Stem -->
    <path d="M 0,16 C 0,8 -1,0 0,-14 C 1,0 0,8 0,16 Z" fill="#D8B878" />

    <!-- Left Elegant Harvest Leaf -->
    <path d="M 0,4 C -8,3 -16,-2 -15,-10 C -12,-16 -4,-12 0,-3 Z" fill="#C5A059" />

    <!-- Right Elegant Harvest Leaf -->
    <path d="M 0,4 C 8,3 16,-2 15,-10 C 12,-16 4,-12 0,-3 Z" fill="#C5A059" />

    <!-- Top Blossom Crown / Sun Leaf -->
    <path d="M 0,-5 C -4,-10 -5,-17 0,-21 C 5,-17 4,-10 0,-5 Z" fill="#D8B878" />

    <!-- Center Radiant Core (Seed / Blossom Center) -->
    <circle cx="0" cy="-2" r="2.8" fill="#FAF7F2" />
    <circle cx="0" cy="-2" r="1.4" fill="#8E2800" />
  </g>
</svg>
